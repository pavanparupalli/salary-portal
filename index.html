<!DOCTYPE html>
<html lang="en">
</head>
<meta charset="UTF-8">
<title>Salary Statement Download</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="sreejas logo.png">
<script src="salary-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
</head>


<body>

<!-- Company Logo at the top of the page -->
<div style="text-align:center; margin-bottom:20px;">
  <img src="top page logo.png" alt="Company Logo" style="max-width:150px; max-height:150px;" />
</div>


<div style="display: flex; align-items: center; gap: 18px; margin-bottom: 18px; justify-content: center;">
  <div style="flex-shrink:0; margin-right: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="employeeSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Select Employee</label>
    <select id="employeeSelect">
      <option value="">-- Select Name --</option>
    </select>
  </div>
  <div style="flex-shrink:0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="monthSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Month (From)</label>
    <select id="monthSelect">
      <option value="Jan-2026">January</option>
      <option value="Feb-2026">February</option>
      <option value="Mar-2026">March</option>
      <option value="Apr-2026">April</option>
      <option value="May-2026">May</option>
      <option value="Jun-2026">June</option>
      <option value="Jul-2026">July</option>
      <option value="Aug-2026">August</option>
      <option value="Sep-2026">September</option>
      <option value="Oct-2026">October</option>
      <option value="Nov-2026">November</option>
      <option value="Dec-2026">December</option>
    </select>
  </div>
  <div style="flex-shrink:0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="monthToSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Month (To)</label>
    <select id="monthToSelect">
      <option value="Jan-2026">January</option>
      <option value="Feb-2026">February</option>
      <option value="Mar-2026">March</option>
      <option value="Apr-2026">April</option>
      <option value="May-2026">May</option>
      <option value="Jun-2026">June</option>
      <option value="Jul-2026">July</option>
      <option value="Aug-2026">August</option>
      <option value="Sep-2026">September</option>
      <option value="Oct-2026">October</option>
      <option value="Nov-2026">November</option>
      <option value="Dec-2026">December</option>
    </select>
  </div>
  <div style="flex-shrink:0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="yearSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Select Year</label>
    <select id="yearSelect"></select>
  </div>
</div>

<div id="downloadBtnContainer" style="text-align:center;">
  <button id="downloadBtn" style="display:none; margin: 15px 0;">Download Statement</button>
</div>

<div class="statement" id="statement">
  <div style="text-align:center; margin-bottom:10px;">
    <img src="top page logo.png" alt="Company Logo" style="max-width:100px; max-height:100px;" />
    <div style="margin-top:8px; font-size:13px; line-height:1.3; color:#222;">
      <strong>SREEJAS HOME FOODS</strong><br>
      PLOT NO B/43, JOURNALIST COLONY, JUBILEE HILLS, HYDERABAD, TELANGANA, 500055<br>
      GSTIN: 36ADNPV0871C1ZD
    </div>
  </div>
  <h4 id="statementTitle">Salary Statement – November 2025</h4>
  <hr>

  <div class="row"><div class="label">Employee Name:</div><div id="empName"></div></div>
  <div class="row"><div class="label">Gross Salary:</div><div id="gross"></div></div>
  <div class="row"><div class="label">Working Days:</div><div id="paidDays"></div></div>
  <div class="row"><div class="label">Basic Salary:</div><div id="basic"></div></div>
  <div class="row"><div class="label">Other Earnings:</div><div id="otherEarnings"></div></div>
  <div class="row"><div class="label"><span style="text-decoration:underline;">Less:</span></div><div></div></div>
  <div class="row"><div class="label">PF:</div><div id="pf"></div></div>
  <div class="row"><div class="label">ESI:</div><div id="esi"></div></div>
  <div class="row"><div class="label">Advance:</div><div id="adv"></div></div>
  <hr style="margin: 8px 0; border-top: 2px solid #f59e0b;">
  <div class="row"><div class="label">Net Salary:</div><div id="netSalary"></div></div>
  <hr style="margin: 8px 0; border-top: 2px solid #f59e0b;">
</div>

<script>

const select = document.getElementById("employeeSelect");
const monthSelect = document.getElementById("monthSelect");
const statementTitle = document.getElementById("statementTitle");
const yearSelect = document.getElementById("yearSelect");

// Populate year select with a range (2026 to current year + 1)
const currentYear = new Date().getFullYear();
// Add default option
const defaultYearOpt = document.createElement("option");
defaultYearOpt.value = "";
defaultYearOpt.textContent = "-- Select Year --";
yearSelect.appendChild(defaultYearOpt);
for (let y = currentYear + 1; y >= 2026; y--) {
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  yearSelect.appendChild(opt);
}

function getSelectedMonthYear() {
  const selectedMonth = monthSelect.value;
  return Array.isArray(salaryData[selectedMonth]) ? salaryData[selectedMonth] : [];
  return { month, year, monthName: monthNames[parseInt(month, 10) - 1] };
}



  const arr = salaryData[monthSelect.value] || [];

function getSalaryArrayForSelectedMonthYear() {
  const monthInfo = getSelectedMonthYear();
  if (!monthInfo) return [];
  const key = `${monthInfo.monthName.slice(0,3)}-${monthInfo.year}`;
  return Array.isArray(salaryData[key]) ? salaryData[key] : [];
}

function populateEmployeeDropdown() {
  // Clear previous options except the first
  select.innerHTML = '<option value="">-- Select Name --</option>';
  const selectedMonth = monthSelect.value;
  if (!selectedMonth || !salaryData[selectedMonth]) return;
  let employees = salaryData[selectedMonth];
  if (selectedMonth === "Jan-2026") {
    employees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
    window.sortedJanEmployees = employees;
    window.sortedFebEmployees = null;
  } else if (selectedMonth === "Feb-2026") {
    employees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
    window.sortedFebEmployees = employees;
    window.sortedJanEmployees = null;
  } else {
    window.sortedJanEmployees = null;
    window.sortedFebEmployees = null;
  }
  employees.forEach((emp) => {
    const option = document.createElement("option");
    option.value = emp.sno;
    option.textContent = emp.name;
    select.appendChild(option);
  });
}

monthSelect.addEventListener("change", () => {
  populateEmployeeDropdown();
  updateStatement();
});
yearSelect.addEventListener("change", () => {
  populateEmployeeDropdown();
  updateStatement();
});
  statementTitle.innerText = `Salary Statement – ${monthSelect.options[monthSelect.selectedIndex].text}`;
// Initial population (in case default month/year is set)
populateEmployeeDropdown();



function updateStatement() {
  const selectedMonthFrom = monthSelect.value;
  const selectedMonthTo = document.getElementById("monthToSelect").value;
  const empSno = Number(select.value);
  let empFrom, empTo;
  // Get employee for From month
  if (selectedMonthFrom === "Jan-2026" && window.sortedJanEmployees) {
    empFrom = window.sortedJanEmployees.find(e => e.sno === empSno);
  } else if (selectedMonthFrom === "Feb-2026" && window.sortedFebEmployees) {
    empFrom = window.sortedFebEmployees.find(e => e.sno === empSno);
  } else {
    empFrom = (salaryData[selectedMonthFrom] || []).find(e => e.sno === empSno);
  }
  // Get employee for To month
  if (selectedMonthTo === "Jan-2026" && window.sortedJanEmployees) {
    empTo = window.sortedJanEmployees.find(e => e.sno === empSno);
  } else if (selectedMonthTo === "Feb-2026" && window.sortedFebEmployees) {
    empTo = window.sortedFebEmployees.find(e => e.sno === empSno);
  } else {
    empTo = (salaryData[selectedMonthTo] || []).find(e => e.sno === empSno);
  }
  const statement = document.getElementById("statement");
  const downloadBtn = document.getElementById("downloadBtn");
  if (!empFrom && !empTo) {
    statement.style.display = "none";
    downloadBtn.style.display = "none";
    return;
  }
  // Loop through all months in range and sum values for the selected employee
  const MONTH_ORDER = [
    "Jan-2026", "Feb-2026", "Mar-2026", "Apr-2026", "May-2026", "Jun-2026",
    "Jul-2026", "Aug-2026", "Sep-2026", "Oct-2026", "Nov-2026", "Dec-2026"
  ];
  const startIdx = MONTH_ORDER.indexOf(selectedMonthFrom);
  const endIdx = MONTH_ORDER.indexOf(selectedMonthTo);
  let gross = 0, paidDays = 0, basic = 0, otherEarnings = 0, pf = 0, esi = 0, adv = 0, netSalary = 0, name = "";
  for (let i = startIdx; i <= endIdx; i++) {
    const month = MONTH_ORDER[i];
    const emp = (salaryData[month] || []).find(e => e.sno === empSno);
    if (emp) {
      name = emp.name;
      gross += Number(emp.gross || 0);
      paidDays += Number(emp.paidDays || 0);
      basic += Number(emp.basic || 0);
      otherEarnings += Number(emp.otherEarnings || 0);
      pf += Number(emp.pf || 0);
      esi += Number(emp.esi || 0);
      adv += Number(emp.adv || 0);
      netSalary += Number(emp.netSalary || 0);
    }
  }
  document.getElementById("empName").innerText = name;
  document.getElementById("gross").innerText = "₹ " + gross;
  document.getElementById("paidDays").innerText = paidDays;
  document.getElementById("basic").innerText = "₹ " + basic;
  document.getElementById("otherEarnings").innerText = "₹ " + otherEarnings;
  document.getElementById("pf").innerText = "₹ " + pf;
  document.getElementById("esi").innerText = "₹ " + esi;
  document.getElementById("adv").innerText = "₹ " + adv;
  document.getElementById("netSalary").innerText = "₹ " + netSalary;
  if (selectedMonthFrom === selectedMonthTo) {
    statementTitle.innerText = `Salary Statement – ${monthSelect.options[monthSelect.selectedIndex].text}`;
  } else {
    statementTitle.innerText = `Salary Statement – ${monthSelect.options[monthSelect.selectedIndex].text} to ${document.getElementById("monthToSelect").options[document.getElementById("monthToSelect").selectedIndex].text}`;
  }
  statement.style.display = "block";
  downloadBtn.style.display = "inline-block";
}


select.addEventListener("change", updateStatement);

document.getElementById("downloadBtn").addEventListener("click", () => {
  const selectedMonthFrom = monthSelect.value;
  const selectedMonthTo = document.getElementById("monthToSelect").value;
  const empIdx = select.value;
  let empFrom, empTo;
  if (selectedMonthFrom === "Jan-2026" && window.sortedJanEmployees) {
    empFrom = window.sortedJanEmployees[empIdx];
  } else if (selectedMonthFrom === "Feb-2026" && window.sortedFebEmployees) {
    empFrom = window.sortedFebEmployees[empIdx];
  } else {
    empFrom = salaryData[selectedMonthFrom] && salaryData[selectedMonthFrom][empIdx];
  }
  if (selectedMonthTo === "Jan-2026" && window.sortedJanEmployees) {
    empTo = window.sortedJanEmployees[empIdx];
  } else if (selectedMonthTo === "Feb-2026" && window.sortedFebEmployees) {
    empTo = window.sortedFebEmployees[empIdx];
  } else {
    empTo = salaryData[selectedMonthTo] && salaryData[selectedMonthTo][empIdx];
  }
  if (!empFrom && !empTo) return;
  let gross = 0, paidDays = 0, basic = 0, name = "";
  if (selectedMonthFrom === selectedMonthTo) {
    if (empFrom) {
      gross = Number(empFrom.gross);
      paidDays = Number(empFrom.paidDays);
      basic = Number(empFrom.basic);
      name = empFrom.name;
    }
  } else {
    if (empFrom) {
      gross += Number(empFrom.gross);
      paidDays += Number(empFrom.paidDays);
      basic += Number(empFrom.basic);
      name = empFrom.name;
    }
    if (empTo) {
      gross += Number(empTo.gross);
      paidDays += Number(empTo.paidDays);
      basic += Number(empTo.basic);
      if (!name) name = empTo.name;
    }
  }
  // Update statement fields before download
  document.getElementById("empName").innerText = name;
  document.getElementById("gross").innerText = "₹ " + gross;
  document.getElementById("paidDays").innerText = paidDays;
  document.getElementById("basic").innerText = "₹ " + basic;
  const statement = document.getElementById("statement");
  let filename;
  if (selectedMonthFrom === selectedMonthTo) {
    filename = `${name}_Salary_${monthSelect.options[monthSelect.selectedIndex].text}.pdf`;
  } else {
    filename = `${name}_Salary_${monthSelect.options[monthSelect.selectedIndex].text}_to_${document.getElementById("monthToSelect").options[document.getElementById("monthToSelect").selectedIndex].text}.pdf`;
  }
  html2pdf()
    .set({
      margin: 0,
      filename: filename,
      jsPDF: { unit: "in", format: [3, 6] }, // Match .statement height
      pagebreak: { mode: ['avoid'] }
    })
    .from(statement)
    .save();
});
</script>

</body>
</html>
