</head>


<body>

</div>

<div style="display: flex; align-items: center; gap: 18px; margin-bottom: 18px; justify-content: center; margin-top: 350px;">
  <div style="flex-shrink:0; margin-right: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;">

    <select id="employeeSelect">

    </select>
  </div>
  <div style="flex-shrink:0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="monthSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Month</label>
    <select id="monthSelect">
      <option value="Jan-2026">January</option>
      <option value="Feb-2026">February</option>
      <option value="Mar-2026">March</option>
      <option value="Apr-2026">April</option>
      <option value="May-2026">May</option>
      <option value="Jun-2026">June</option>
      <option value="Jul-2026">July</option>
      <option value="Aug-2026">August</option>
      <option value="Sep-2026">September</option>
      <option value="Oct-2026">October</option>
      <option value="Nov-2026">November</option>
      <option value="Dec-2026">December</option>
    </select>
  </div>
  
  <div style="flex-shrink:0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
    <label for="yearSelect" style="font-weight: 500; color: #2d3a4b; margin-right: 4px; text-align: center; width: 100%;">Select Year</label>
    <select id="yearSelect"></select>
  </div>
</div>

<div id="downloadBtnContainer" style="text-align:center;">
  <button id="downloadBtn" style="display:none; margin: 15px 0;">Download Statement</button>
</div>

<div class="statement" id="statement">
  <div style="text-align:center; margin-bottom:10px;">
    <img src="top page logo.png" alt="Company Logo" style="max-width:100px; max-height:100px;" />
    <div style="margin-top:8px; font-size:13px; line-height:1.3; color:#222;">
      <strong>SREEJAS HOME FOODS</strong><br>
      PLOT NO B/43, JOURNALIST COLONY, JUBILEE HILLS, HYDERABAD, TELANGANA, 500055<br>
      GSTIN: 36ADNPV0871C1ZD
    </div>
  </div>
  <h4 id="statementTitle">Salary Statement – November 2025</h4>
  <hr>

  <div class="row"><div class="label">Employee Name:</div><div id="empName"></div></div>
  <div class="row"><div class="label">Gross Salary:</div><div id="gross"></div></div>
  <div class="row"><div class="label">Working Days:</div><div id="paidDays"></div></div>
  <div class="row"><div class="label">Basic Salary:</div><div id="basic"></div></div>
  <div class="row"><div class="label">Other Earnings:</div><div id="otherEarnings"></div></div>
  <div class="row"><div class="label"><span style="text-decoration:underline;">Less:</span></div><div></div></div>
  <div class="row"><div class="label">PF:</div><div id="pf"></div></div>
  <div class="row"><div class="label">ESI:</div><div id="esi"></div></div>
    <div class="row"><div class="label">Professional Tax:</div><div id="professionalTax"></div></div>
  <div class="row"><div class="label">Advance:</div><div id="adv"></div></div>
  <hr style="margin: 8px 0; border-top: 2px solid #f59e0b;">
  <div class="row"><div class="label">Net Salary:</div><div id="netSalary"></div></div>
  <hr style="margin: 8px 0; border-top: 2px solid #f59e0b;">
</div>

<script>

const select = document.getElementById("employeeSelect");
const monthSelect = document.getElementById("monthSelect");
const statementTitle = document.getElementById("statementTitle");
const yearSelect = document.getElementById("yearSelect");

// Only add 2026 as a year option
const defaultYearOpt = document.createElement("option");
defaultYearOpt.value = "";
defaultYearOpt.textContent = "-- Select Year --";
yearSelect.appendChild(defaultYearOpt);
const opt2026 = document.createElement("option");
opt2026.value = "2026";
opt2026.textContent = "2026";
yearSelect.appendChild(opt2026);

function getSelectedMonthYear() {
  const selectedMonth = monthSelect.value;
  return Array.isArray(salaryData[selectedMonth]) ? salaryData[selectedMonth] : [];
  return { month, year, monthName: monthNames[parseInt(month, 10) - 1] };
}



  const arr = salaryData[monthSelect.value] || [];

function getSalaryArrayForSelectedMonthYear() {
  const monthInfo = getSelectedMonthYear();
  if (!monthInfo) return [];
  const key = `${monthInfo.monthName.slice(0,3)}-${monthInfo.year}`;
  return Array.isArray(salaryData[key]) ? salaryData[key] : [];
}

function populateEmployeeDropdown() {
  // Clear previous options except the first
  select.innerHTML = '<option value="">-- Select Name --</option>';
  const selectedMonth = monthSelect.value;
  if (!selectedMonth || !salaryData[selectedMonth]) return;
  let employees = salaryData[selectedMonth];
  if (selectedMonth === "Jan-2026") {
    employees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
    window.sortedJanEmployees = employees;
    window.sortedFebEmployees = null;
  } else if (selectedMonth === "Feb-2026") {
    employees = [...employees].sort((a, b) => a.name.localeCompare(b.name));
    window.sortedFebEmployees = employees;
    window.sortedJanEmployees = null;
  } else {
    window.sortedJanEmployees = null;
    window.sortedFebEmployees = null;
  }
  employees.forEach((emp) => {
    const option = document.createElement("option");
    option.value = emp.sno;
    option.textContent = emp.name;
    select.appendChild(option);
  });
}

monthSelect.addEventListener("change", () => {
  populateEmployeeDropdown();
  updateStatement();
});
yearSelect.addEventListener("change", () => {
  populateEmployeeDropdown();
  updateStatement();
});
  statementTitle.innerText = `Salary Statement – ${monthSelect.options[monthSelect.selectedIndex].text}`;
// Initial population (in case default month/year is set)
populateEmployeeDropdown();



function updateStatement() {
  const selectedMonth = monthSelect.value;
  const empSno = Number(select.value);
  let emp = (salaryData[selectedMonth] || []).find(e => e.sno === empSno);
  const statement = document.getElementById("statement");
  const downloadBtn = document.getElementById("downloadBtn");
  if (!emp) {
    statement.style.display = "none";
    downloadBtn.style.display = "none";
    return;
  }
  document.getElementById("empName").innerText = emp.name;
  document.getElementById("gross").innerText = "₹ " + (emp.gross || 0);
  document.getElementById("paidDays").innerText = emp.paidDays || 0;
  document.getElementById("basic").innerText = "₹ " + (emp.basic || 0);
  document.getElementById("otherEarnings").innerText = "₹ " + (emp.otherEarnings || 0);
  document.getElementById("pf").innerText = "₹ " + (emp.pf || 0);
  document.getElementById("esi").innerText = "₹ " + (emp.esi || 0);
  document.getElementById("professionalTax").innerText = "₹ " + (emp.professionalTax || 0);
  document.getElementById("adv").innerText = "₹ " + (emp.adv || 0);
  const netSalary =
    (emp.gross || 0) +
    (emp.otherEarnings || 0) -
    (emp.pf || 0) -
    (emp.esi || 0) -
    (emp.professionalTax || 0) -
    (emp.adv || 0);
  document.getElementById("netSalary").innerText = "₹ " + netSalary;
  statementTitle.innerText = `Salary Statement – ${monthSelect.options[monthSelect.selectedIndex].text}`;
  statement.style.display = "block";
  downloadBtn.style.display = "inline-block";
}


select.addEventListener("change", updateStatement);

document.getElementById("downloadBtn").addEventListener("click", () => {
  const selectedMonth = monthSelect.value;
  const empSno = Number(select.value);
  const emp = (salaryData[selectedMonth] || []).find(e => e.sno === empSno);
  // Update statement fields before download
  document.getElementById("empName").innerText = emp?.name || "";
  document.getElementById("gross").innerText = "₹ " + (emp?.gross || 0);
  document.getElementById("paidDays").innerText = emp?.paidDays || 0;
  document.getElementById("basic").innerText = "₹ " + (emp?.basic || 0);
  document.getElementById("otherEarnings").innerText = "₹ " + (emp?.otherEarnings || 0);
  document.getElementById("pf").innerText = "₹ " + (emp?.pf || 0);
  document.getElementById("esi").innerText = "₹ " + (emp?.esi || 0);
  document.getElementById("professionalTax").innerText = "₹ " + (emp?.professionalTax || 0);
  document.getElementById("adv").innerText = "₹ " + (emp?.adv || 0);
  const netSalary =
    (emp?.gross || 0) +
    (emp?.otherEarnings || 0) -
    (emp?.pf || 0) -
    (emp?.esi || 0) -
    (emp?.professionalTax || 0) -
    (emp?.adv || 0);
  document.getElementById("netSalary").innerText = "₹ " + netSalary;
  const statement = document.getElementById("statement");
  let filename = `${emp?.name || "Employee"}_Salary_${monthSelect.options[monthSelect.selectedIndex].text}.pdf`;
  html2pdf()
    .set({
      margin: 0,
      filename: filename,
      jsPDF: { unit: "in", format: [3, 6] }, // Match .statement height
      pagebreak: { mode: ['avoid'] }
    })
    .from(statement)
    .save();
});
</script>

</body>
